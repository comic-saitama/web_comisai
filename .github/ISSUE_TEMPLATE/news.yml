name: お知らせを追加したい
description: トップページの「お知らせ」に載せたい内容を依頼します
title: "[お知らせ] "
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        トップページの「お知らせ」に載せる内容を書いてください。Web担当がサイトに反映します。
        自分で追加する場合は README の「お知らせを追加する」を参照してください。
  - type: input
    id: title
    attributes:
      label: タイトル
      placeholder: 例）サークル参加申込の受付を開始しました
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 掲載したい日
      description: 掲載日として表示される日付です。決まっていなければ空欄で構いません。
      placeholder: 例）2027-05-10
  - type: textarea
    id: body
    attributes:
      label: 本文
      description: そのまま掲載できる文章で書いてください。リンクは URL をそのまま貼れば大丈夫です。
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: 急ぎ具合
      options:
        - 急ぎ（今日中）
        - 数日以内
        - 急がない
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 日付・場所・金額など、事実関係を準備会で確認済み
          required: true

# Astro でビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # すべての PR でビルドを確認する（PR の上に重ねた PR も含む）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # PR でもビルド（型チェック含む）を実行し、壊れた変更を main に入れない
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6

  # main への push 時のみ公開する
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
